<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoodieGhost Grows Dashboard</title>
    <!-- Google Fonts Lookup -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Creepster&family=Permanent+Marker&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Local Lowcase Filename Mappings -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="fog-canvas"></canvas>

    <div class="dashboard-wrapper">
        <!-- Header & Mascot Frame -->
        <header class="main-header">
            <div class="mascot-frame">
                <img src="logo.png" alt="HoodieGhost Logo" id="mascot-img" onerror="this.style.display='none';">
            </div>
            <h1 class="dripping-title">HOODIEGHOST GROWS</h1>
        </header>

        <!-- Workspace Tent Navigation Controls -->
        <nav class="tent-nav">
            <button class="tent-btn active" data-tent="tent1">Tent 1</button>
            <button class="tent-btn" data-tent="tent2">Tent 2</button>
            <button class="tent-btn" data-tent="tent3">Tent 3</button>
        </nav>

        <!-- Main Workspace Dynamic Content Area -->
        <main class="grid-container">
            <!-- Timeline Tracking Panel -->
            <section class="panel-card timeline-panel">
                <h2 class="panel-heading">Plant Timeline</h2>
                <div class="slider-container">
                    <input type="range" id="age-slider" min="1" max="120" value="1">
                    <div class="age-display">
                        <span id="age-text">Day 1</span> - <span id="stage-text">Germination</span>
                    </div>
                </div>
            </section>

            <!-- Calculation Core (VPD Subsystem) -->
            <section class="panel-card vpd-panel">
                <h2 class="panel-heading">VPD Engine</h2>
                <div class="unit-selector">
                    <label>
                        <input type="radio" name="temp-unit" value="F" checked> °F
                    </label>
                    <label>
                        <input type="radio" name="temp-unit" value="C"> °C
                    </label>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="air-temp">Air Temp</label>
                        <input type="number" id="air-temp" value="78" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="room-rh">Humidity (%)</label>
                        <input type="number" id="room-rh" value="60" step="1" min="0" max="100">
                    </div>
                </div>
                <div class="vpd-output">
                    <div class="metric-label">Target Leaf Temp (-2° Offset): <span id="leaf-temp-display">76.0°F</span></div>
                    <div class="metric-value" id="vpd-display">0.00 kPa</div>
                </div>
            </section>

            <!-- Split Shelf Feeds Panel -->
            <section class="panel-card feeds-panel">
                <h2 class="panel-heading">Split Shelf Feeds</h2>
                <div class="checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="cal-check">
                        <span class="checkmark"></span>
                        Independent Pure Calcium
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" id="mag-check">
                        <span class="checkmark"></span>
                        Independent Pure Magnesium
                    </label>
                </div>
                <div id="ro-warning" class="warning-banner hidden">
                    ⚠️ CRITICAL DEFICIENCY RISK: Pure RO Water Layout Detected!
                </div>
            </section>

            <!-- Additive Injection Terminal -->
            <section class="panel-card inventory-panel">
                <h2 class="panel-heading">Additive Terminal</h2>
                <div class="terminal-form">
                    <input type="text" id="additive-input" placeholder="Type missing booster brand..." autocomplete="off">
                    <button id="inject-btn">Inject</button>
                </div>
                <ul id="inventory-grid" class="inventory-list">
                    <!-- Dynamic Rows Populate Here -->
                </ul>
            </section>
        </main>
    </div>

    <!-- Core Interactive Hook Script -->
    <script src="app.js"></script>
</body>
</html>
